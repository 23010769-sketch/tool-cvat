# Mọi kết quả là rectangle; semantic model cung cấp vùng để lấy box từng vùng rời.
# Không bao gồm lane/drivable.
# ID/type đã đối chiếu báo cáo API Job 206; mỗi lần chạy vẫn xác minh lại quyền/phạm vi.
[yolo]
pipeline = "scene"
output_geometry = "rectangle"
model = "models/bdd100k-yolo11n.pt"
confidence = 0.45
iou = 0.50
duplicate_iou = 0.70
batch_size = 1
image_size = 640
device = "cpu"
semantic_model = "models/segformer-b0-cityscapes"
semantic_image_size = 640
semantic_confidence = 0.50
semantic_min_pixels = 64

