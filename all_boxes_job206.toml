# All 31 target labels use rectangles, per the user's requested format.
# Lane/drivable require exact local RGB matches with public BDD reference images.
[yolo]
pipeline = "scene-reference"
output_geometry = "rectangle"
model = "models/bdd100k-yolo11n.pt"
confidence = 0.45
iou = 0.50
duplicate_iou = 0.70
batch_size = 1
image_size = 640
device = "cpu"
semantic_model = "models/segformer-b0-cityscapes"
semantic_image_size = 640
semantic_confidence = 0.50
semantic_min_pixels = 64

